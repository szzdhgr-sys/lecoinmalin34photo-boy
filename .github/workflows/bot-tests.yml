name: Telegram bot checks

on:
  push:
    branches:
      - main
      - "fix/telegram-bot-*"
  pull_request:

jobs:
  bot-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check bot syntax
        run: python -m compileall -q bot.py bot_v6.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
